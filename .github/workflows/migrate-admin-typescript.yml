name: Migrate Admin to TypeScript

on:
  push:
    branches:
      - next-js

permissions:
  contents: write

jobs:
  migrate-admin:
    if: ${{ !contains(github.event.head_commit.message, '[admin-ts-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout next-js
        uses: actions/checkout@v4
        with:
          ref: next-js
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package.json

      - name: Convert all admin JavaScript source files
        working-directory: admin
        run: |
          set -e
          while IFS= read -r -d '' file; do
            case "$file" in
              *.jsx)
                target="${file%.jsx}.tsx"
                if [ -e "$target" ]; then rm "$file"; else mv "$file" "$target"; fi
                ;;
              *.js)
                target="${file%.js}.ts"
                if [ -e "$target" ]; then rm "$file"; else mv "$file" "$target"; fi
                ;;
            esac
          done < <(find app src -type f \( -name '*.jsx' -o -name '*.js' \) -print0)

          node <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.devDependencies = {
            ...(pkg.devDependencies || {}),
            '@types/node': '^22.15.0',
            '@types/react': '^19.0.0',
            '@types/react-dom': '^19.0.0',
            typescript: '^5.8.3'
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE

      - name: Normalize TypeScript imports
        working-directory: admin
        run: |
          find app src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 sed -i -E "s/(from ['\"][^'\"]+)\.(jsx|js)(['\"])/\1\3/g"

      - name: Validate TypeScript and Next.js build
        working-directory: admin
        run: |
          npm install
          npx tsc --noEmit
          npm run build

      - name: Commit completed migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/migrate-admin-typescript.yml
          git add -A admin .github/workflows/migrate-admin-typescript.yml
          git commit -m "complete admin TypeScript migration [admin-ts-migration]" || exit 0
          git push origin next-js
