services:
  postgres:
    image: postgres:17-alpine
    container_name: chirru-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chirru_portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-chirru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chirru_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chirru} -d ${POSTGRES_DB:-chirru_portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  chirru_postgres_data:
    name: chirru-postgres-data
