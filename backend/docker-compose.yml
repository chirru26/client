services:
  postgres:
    image: postgres:17-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: chirru
      POSTGRES_PASSWORD: Chiranjit809
    ports:
      - "5433:5432"
    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirru -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolio_postgres_data:
